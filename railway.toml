# Tutor Portal — Railway deployment config
# Deploy: link the repo (or `railway up`), Railway builds the Dockerfile.
# Mount a volume at /app/data so data/tutor.db survives redeploys, and set:
#   OLLAMA_URL   local model endpoint, if one is reachable from the host
#   TUTOR_MODEL  e.g. hermes3:latest
# Without a reachable OLLAMA_URL the AI engines are unavailable and the
# Notes -> Study Kit feature still works on the offline rules engine.

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8080}"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 100
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
